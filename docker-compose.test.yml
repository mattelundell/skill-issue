# A throwaway PostgreSQL for the integration tests: loopback only, kept in
# memory, gone when stopped. The credentials below protect nothing.
services:
  db-test:
    image: postgres@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188 # 19-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:54747:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test"]
      interval: 1s
      timeout: 2s
      retries: 30
