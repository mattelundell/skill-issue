- id: prova-minnas
  type: free-recall
  concepts: [repetition]
  sources: [om-appen]
  prompt: "Fritt minne: tänk ut svaret, visa det, och säg själv om du kunde det. Vilken tangent går vidare i en lektion?"
  answer: Enter.
  explanation: >
    Här rättar du dig själv, och repetitionen bygger på det — säg hellre nej en gång för mycket.
    Det finns sju sorters frågor till: ett eller flera svar, sant eller falskt, tal, korta ord, ordning och par.
