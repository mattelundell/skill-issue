# Every check the README asks of a change, on every pull request and on main,
# so none of them depends on someone remembering to type it. Third-party actions
# and images are pinned by digest; the comment is the version each was taken at.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: lint, types, tests, browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: pnpm, checksum verified
        run: sh scripts/install-pnpm.sh
      - run: pnpm install --frozen-lockfile
      # Lint reads the packages' built types, so they are built first.
      - name: build packages
        run: pnpm --filter "./packages/*" run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: build
        run: pnpm run build
      - name: unit tests
        run: pnpm run test
      - name: test database
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: integration tests
        run: pnpm run test:integration
      - name: browser for the browser tests
        run: pnpm --filter @skill-issue/e2e exec playwright install --with-deps chromium
      - name: browser tests
        run: pnpm run test:e2e

  image:
    name: image, SBOM, known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the image
        run: docker build --tag skill-issue:ci .
      - name: take the SBOMs out of the image
        run: |
          id="$(docker create skill-issue:ci)"
          docker cp "$id:/app/sbom" ./sbom
          docker rm "$id"
          ls sbom
      # Fails on a HIGH or CRITICAL vulnerability with a known fix in anything the image ships.
      - name: scan the SBOMs
        run: |
          for file in sbom/*.cdx.json; do
            echo "== $file"
            docker run --rm -v "$PWD/sbom:/sbom:ro" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              sbom --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "/sbom/$(basename "$file")"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
