# Starts the application and its database. The application is reachable from
# this machine only, at http://127.0.0.1:4747.
#
# Before the first start, create the database password:  ./scripts/init-secrets.sh
services:
  db:
    image: postgres@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188 # 19-alpine
    environment:
      POSTGRES_USER: skill_issue
      POSTGRES_DB: skill_issue
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skill_issue", "-d", "skill_issue"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:4747:4747"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  db-data:
